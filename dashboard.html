<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Gestión de Cobros</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dashboard-body">

  <!-- Barra superior -->
  <header class="topbar">
    <div class="topbar-brand">
      <h1>Gestión de Cobros</h1>
    </div>
    <div class="topbar-user">
      <span>Hola, <strong id="user-name"></strong></span>
      <span id="user-role" class="badge"></span>
      <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
    </div>
  </header>

  <main class="container">
    <!-- Tarjetas de resumen financiero -->
    <section class="kpi-grid">
      <div class="kpi-card ingreso">
        <div class="kpi-title">Total Ingresos</div>
        <div class="kpi-value" id="total-ingresos">$0.00</div>
      </div>
      <div class="kpi-card egreso">
        <div class="kpi-title">Total Egresos</div>
        <div class="kpi-value" id="total-egresos">$0.00</div>
      </div>
      <div class="kpi-card balance">
        <div class="kpi-title">Balance Neto</div>
        <div class="kpi-value" id="total-balance">$0.00</div>
      </div>
    </section>

    <!-- Filtros y Botón de Nuevo Registro -->
    <section class="toolbar">
      <div class="filters">
        <input type="text" id="filtro-texto" placeholder="Buscar por detalle...">
        <select id="filtro-tipo">
          <option value="">Todos los tipos</option>
          <option value="INGRESO">Solo INGRESOS</option>
          <option value="EGRESO">Solo EGRESOS</option>
        </select>
        <!-- Filtro por usuario visible solo para ADMINISTRADOR -->
        <select id="filtro-usuario" style="display: none;">
          <option value="">Todos los usuarios</option>
        </select>
      </div>

      <button id="btn-abrir-modal" class="btn-success" style="display: none;">
        + Nuevo Registro
      </button>
    </section>

    <!-- Tabla de registros -->
    <section class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Usuario</th>
            <th>Tipo</th>
            <th>Detalle</th>
            <th>Valor</th>
            <th>Comprobante</th>
            <th id="col-acciones" style="display: none;">Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-registros">
          <tr>
            <td colspan="7" style="text-align: center; padding: 2rem;">Cargando registros...</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <!-- MODAL PARA CREAR NUEVO REGISTRO (Solo ADMINISTRADOR) -->
  <div id="modal-registro" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Nuevo Registro de Cobro</h3>
        <button type="button" class="close-btn" id="btn-cerrar-modal">&times;</button>
      </div>

      <div id="modal-error" class="error"></div>

      <form id="form-registro">
        <div class="form-group">
          <label for="reg-usuario">Usuario asignado *</label>
          <select id="reg-usuario" required>
            <option value="">Cargando usuarios...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="reg-tipo">Tipo de movimiento *</label>
          <select id="reg-tipo" required>
            <option value="INGRESO">INGRESO</option>
            <option value="EGRESO">EGRESO</option>
          </select>
        </div>

        <div class="form-group">
          <label for="reg-fecha">Fecha *</label>
          <input type="date" id="reg-fecha" required>
        </div>

        <div class="form-group">
          <label for="reg-valor">Valor ($) *</label>
          <input type="number" id="reg-valor" step="0.01" min="0.01" required placeholder="0.00">
        </div>

        <div class="form-group">
          <label for="reg-detalle">Detalle / Concepto</label>
          <input type="text" id="reg-detalle" maxlength="255" placeholder="Ej. Pago cuota mensual">
        </div>

        <div class="form-group">
          <label for="reg-imagen">Imagen de comprobante (opcional)</label>
          <input type="file" id="reg-imagen" accept="image/*">
          <img id="preview-imagen" class="preview-img" alt="Vista previa">
        </div>

        <button type="submit" id="btn-guardar-registro" class="btn-success" style="width: 100%; margin-top: 0.5rem;">
          Guardar Registro
        </button>
      </form>
    </div>
  </div>

  <!-- MODAL PARA VER COMPROBANTE -->
  <div id="modal-foto" class="modal-overlay">
    <div class="modal-box" style="text-align: center; max-width: 550px;">
      <div class="modal-header">
        <h3>Comprobante Adjunto</h3>
        <button type="button" class="close-btn" onclick="cerrarModalFoto()">&times;</button>
      </div>
      <img id="img-visor" src="" alt="Comprobante" style="max-width: 100%; border-radius: 8px;">
    </div>
  </div>

  <script src="../js/dashboard.js"></script>
</body>
</html>
